name: Changed code quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.1
        with:
          pixi-version: v0.82.0
          environments: quality
      - name: Check changed files and affected small tests
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: |
          base=$(git merge-base "$PR_BASE" HEAD)
          make quality-changed BASE="$base"
          changed=$(git diff --name-only "$base" HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(Makefile|pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/quality\.yml)$'; then
            pixi run -e quality pre-commit run --files scripts/build_latex.py scripts/pack_context.sh
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(Makefile|scripts/(build_latex|test_build_latex)\.py)$'; then
            pixi run -e quality pytest -q -p no:cacheprovider scripts/test_build_latex.py::BuildTests
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(Makefile|scripts/test_quality_commands\.py)$'; then
            pixi run -e quality pytest -q -p no:cacheprovider scripts/test_quality_commands.py
          fi
          if printf '%s\n' "$changed" | grep -Eq '^scripts/(setup_ide_mcp\.sh|test_setup_ide_mcp\.py)$'; then
            pixi run -e quality pytest -q -p no:cacheprovider scripts/test_setup_ide_mcp.py
          fi
          if printf '%s\n' "$changed" | grep -Eq '^scripts/(sync_common_core|test_sync_common_core)\.py$'; then
            pixi run -e quality pytest -q -p no:cacheprovider scripts/test_sync_common_core.py
          fi
